<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generador de hojas de personaje de D&D en PDF. Carga los datos de tu personaje y exporta un PDF con tu hoja de personaje." />
  <title>Generador de Hoja de Personaje D&D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-ornament left"></div>
      <div class="header-content">
        <h1 class="app-title">
          <span class="title-icon">⚔️</span>
          Forja de Personajes
          <span class="title-icon">🛡️</span>
        </h1>
        <p class="app-subtitle">Generador de Hojas de Personaje D&D</p>
      </div>
      <div class="header-ornament right"></div>
    </header>

    <!-- Main Content -->
    <main class="main-layout">
      <!-- Left Panel: Form -->
      <aside class="form-panel">
        <div class="panel-header">
          <span class="panel-icon">📜</span>
          <h2>Datos del Personaje</h2>
        </div>

        <!-- Character Name -->
        <div class="form-section">
          <div class="section-title">
            <span class="section-icon">👤</span>
            <h3>Identidad</h3>
          </div>
          <div class="form-group">
            <label for="charName">Nombre del Personaje</label>
            <input type="text" id="charName" placeholder="Ej: Arthas el Valiente" autocomplete="off" />
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.5rem;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="charLevel">Nivel</label>
              <input type="text" id="charLevel" placeholder="1" />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="charClass">Clase</label>
              <input type="text" id="charClass" placeholder="Guerrero" />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="charSpecies">Especie</label>
              <input type="text" id="charSpecies" placeholder="Humano" />
            </div>
          </div>
        </div>

        <!-- Combate -->
        <div class="form-section">
          <div class="section-title">
            <span class="section-icon">🛡️</span>
            <h3>Combate</h3>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="combatInit">Iniciativa</label>
              <input type="text" id="combatInit" placeholder="+2" />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="combatCD">CD</label>
              <input type="text" id="combatCD" placeholder="12" />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="combatSpeed">Velocidad</label>
              <input type="text" id="combatSpeed" placeholder="30 ft" />
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 0.5rem;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="combatHP">Puntos de Golpe</label>
              <input type="text" id="combatHP" placeholder="12/12" />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="combatAC">CA</label>
              <input type="text" id="combatAC" placeholder="16" />
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="combatDefenses">Defensas</label>
            <textarea id="combatDefenses" placeholder="Resistencia a fuego" rows="2" style="width: 100%; background: var(--bg-input); border: 1px solid var(--border-medium); color: var(--text-primary); padding: 0.5rem; border-radius: 4px; font-family: inherit; resize: vertical;"></textarea>
          </div>
        </div>

        <!-- Stats -->
        <div class="form-section">
          <div class="section-title">
            <span class="section-icon">⚔️</span>
            <h3>Atributos</h3>
          </div>

          <!-- Fuerza -->
          <div class="stat-row" data-stat="fuerza">
            <div class="stat-label">
              <span class="stat-badge str">💪</span>
              <span class="stat-name">Fuerza</span>
            </div>
            <div class="stat-inputs">
              <div class="stat-input-group">
                <label>Valor</label>
                <input type="text" id="strValue" class="stat-input" placeholder="10" />
              </div>
              <div class="stat-input-group">
                <label>Mod</label>
                <input type="text" id="strMod" class="stat-input" placeholder="+0" />
              </div>
              <div class="stat-input-group">
                <label>Salv</label>
                <input type="text" id="strSave" class="stat-input" placeholder="+0" />
              </div>
            </div>
          </div>

          <!-- Destreza -->
          <div class="stat-row" data-stat="destreza">
            <div class="stat-label">
              <span class="stat-badge dex">🏹</span>
              <span class="stat-name">Destreza</span>
            </div>
            <div class="stat-inputs">
              <div class="stat-input-group">
                <label>Valor</label>
                <input type="text" id="dexValue" class="stat-input" placeholder="10" />
              </div>
              <div class="stat-input-group">
                <label>Mod</label>
                <input type="text" id="dexMod" class="stat-input" placeholder="+0" />
              </div>
              <div class="stat-input-group">
                <label>Salv</label>
                <input type="text" id="dexSave" class="stat-input" placeholder="+0" />
              </div>
            </div>
          </div>

          <!-- Constitución -->
          <div class="stat-row" data-stat="constitucion">
            <div class="stat-label">
              <span class="stat-badge con">🛡️</span>
              <span class="stat-name">Constitución</span>
            </div>
            <div class="stat-inputs">
              <div class="stat-input-group">
                <label>Valor</label>
                <input type="text" id="conValue" class="stat-input" placeholder="10" />
              </div>
              <div class="stat-input-group">
                <label>Mod</label>
                <input type="text" id="conMod" class="stat-input" placeholder="+0" />
              </div>
              <div class="stat-input-group">
                <label>Salv</label>
                <input type="text" id="conSave" class="stat-input" placeholder="+0" />
              </div>
            </div>
          </div>

          <!-- Inteligencia -->
          <div class="stat-row" data-stat="inteligencia">
            <div class="stat-label">
              <span class="stat-badge int">📖</span>
              <span class="stat-name">Inteligencia</span>
            </div>
            <div class="stat-inputs">
              <div class="stat-input-group">
                <label>Valor</label>
                <input type="text" id="intValue" class="stat-input" placeholder="10" />
              </div>
              <div class="stat-input-group">
                <label>Mod</label>
                <input type="text" id="intMod" class="stat-input" placeholder="+0" />
              </div>
              <div class="stat-input-group">
                <label>Salv</label>
                <input type="text" id="intSave" class="stat-input" placeholder="+0" />
              </div>
            </div>
          </div>

          <!-- Sabiduría -->
          <div class="stat-row" data-stat="sabiduria">
            <div class="stat-label">
              <span class="stat-badge wis">👁️</span>
              <span class="stat-name">Sabiduría</span>
            </div>
            <div class="stat-inputs">
              <div class="stat-input-group">
                <label>Valor</label>
                <input type="text" id="wisValue" class="stat-input" placeholder="10" />
              </div>
              <div class="stat-input-group">
                <label>Mod</label>
                <input type="text" id="wisMod" class="stat-input" placeholder="+0" />
              </div>
              <div class="stat-input-group">
                <label>Salv</label>
                <input type="text" id="wisSave" class="stat-input" placeholder="+0" />
              </div>
            </div>
          </div>

          <!-- Carisma -->
          <div class="stat-row" data-stat="carisma">
            <div class="stat-label">
              <span class="stat-badge cha">🎭</span>
              <span class="stat-name">Carisma</span>
            </div>
            <div class="stat-inputs">
              <div class="stat-input-group">
                <label>Valor</label>
                <input type="text" id="chaValue" class="stat-input" placeholder="10" />
              </div>
              <div class="stat-input-group">
                <label>Mod</label>
                <input type="text" id="chaMod" class="stat-input" placeholder="+0" />
              </div>
              <div class="stat-input-group">
                <label>Salv</label>
                <input type="text" id="chaSave" class="stat-input" placeholder="+0" />
              </div>
            </div>
          </div>
        </div>

        <!-- Armas -->
        <div class="form-section">
          <div class="section-title">
            <span class="section-icon">⚔️</span>
            <h3>Armas</h3>
          </div>
          <!-- We will create 5 rows, each with 5 inputs -->
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <!-- Row 1 -->
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 2fr; gap: 0.2rem;">
              <input type="text" id="w1Name" placeholder="Arma" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w1Atk" placeholder="Bono" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w1Dmg" placeholder="Daño" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w1Type" placeholder="Tipo" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w1Notes" placeholder="Notas" style="font-size: 0.8rem; padding: 0.2rem;" />
            </div>
            <!-- Row 2 -->
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 2fr; gap: 0.2rem;">
              <input type="text" id="w2Name" placeholder="Arma" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w2Atk" placeholder="Bono" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w2Dmg" placeholder="Daño" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w2Type" placeholder="Tipo" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w2Notes" placeholder="Notas" style="font-size: 0.8rem; padding: 0.2rem;" />
            </div>
            <!-- Row 3 -->
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 2fr; gap: 0.2rem;">
              <input type="text" id="w3Name" placeholder="Arma" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w3Atk" placeholder="Bono" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w3Dmg" placeholder="Daño" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w3Type" placeholder="Tipo" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w3Notes" placeholder="Notas" style="font-size: 0.8rem; padding: 0.2rem;" />
            </div>
            <!-- Row 4 -->
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 2fr; gap: 0.2rem;">
              <input type="text" id="w4Name" placeholder="Arma" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w4Atk" placeholder="Bono" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w4Dmg" placeholder="Daño" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w4Type" placeholder="Tipo" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w4Notes" placeholder="Notas" style="font-size: 0.8rem; padding: 0.2rem;" />
            </div>
            <!-- Row 5 -->
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 2fr; gap: 0.2rem;">
              <input type="text" id="w5Name" placeholder="Arma" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w5Atk" placeholder="Bono" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w5Dmg" placeholder="Daño" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w5Type" placeholder="Tipo" style="font-size: 0.8rem; padding: 0.2rem;" />
              <input type="text" id="w5Notes" placeholder="Notas" style="font-size: 0.8rem; padding: 0.2rem;" />
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button id="importJsonBtn" class="export-btn" style="background: linear-gradient(135deg, #4b2d6b 0%, #8c3cc4 50%, #4b2d6b 100%); border-color: #8c3cc4; width: 100%; margin-bottom: 0.5rem;">
            <span class="btn-icon">📥</span>
            Importar JSON (D&D Beyond)
            <span class="btn-glow"></span>
          </button>
          <!-- Hidden file input for JSON -->
          <input type="file" id="jsonFileInput" accept=".json" style="display: none;" />
          
          <div style="display: flex; gap: 0.5rem; width: 100%;">
            <button id="randomBtn" class="random-btn" style="flex: 1;">
              <span class="btn-icon">🎲</span> Aleatorio
              <span class="btn-glow"></span>
            </button>
            <button id="calibrateBtn" class="export-btn" style="flex: 1; background: linear-gradient(135deg, #2d5a6b 0%, #3c8bc4 50%, #2d5a6b 100%); border-color: #3c8bc4;">
              <span class="btn-icon">🎯</span> Calibrar
              <span class="btn-glow"></span>
            </button>
            <button id="exportBtn" class="export-btn" style="flex: 1;">
              <span class="btn-icon">📄</span> Exportar
              <span class="btn-glow"></span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Right Panel: Preview -->
      <section class="preview-panel">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="panel-icon">👁️</span>
            <h2>Vista Previa</h2>
          </div>
          
          <!-- Calibration Controls (Hidden by default) -->
          <div id="calibrationPanel" style="display: none; background: rgba(0,0,0,0.5); border: 1px solid var(--border-medium); border-radius: var(--radius-md); padding: 0.5rem 1rem; font-size: 0.8rem;">
            <div style="display: flex; gap: 1rem; align-items: center;">
              <div id="calInfo" style="color: var(--gold-light); min-width: 150px;">
                Hacé click en un texto para seleccionarlo
              </div>
              <div id="calControls" style="display: none; gap: 0.5rem; align-items: center;">
                <span>Tamaño:</span>
                <button onclick="window.adjustFontSize(-0.1)" style="padding: 0.2rem 0.5rem; background: var(--bg-input); color: white; border: 1px solid var(--border-dark); cursor: pointer;">-</button>
                <button onclick="window.adjustFontSize(0.1)" style="padding: 0.2rem 0.5rem; background: var(--bg-input); color: white; border: 1px solid var(--border-dark); cursor: pointer;">+</button>
              </div>
              <div style="display: flex; gap: 0.5rem; margin-left: 1rem;">
                <button id="calSaveBtn" onclick="window.saveCalibration()" style="padding: 0.4rem 0.8rem; background: #2b5c2b; color: white; border: 1px solid #4caf50; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar</button>
                <button onclick="window.resetCalibration()" style="padding: 0.4rem 0.8rem; background: #6b2d2d; color: white; border: 1px solid #f44336; border-radius: 4px; cursor: pointer;">Resetear</button>
              </div>
            </div>
          </div>
        </div>
        <div class="preview-container" id="previewContainer">
          <div class="preview-wrapper" id="previewWrapper">
            <img src="/Hoja_modelo.jpg" alt="Hoja de personaje D&D" class="preview-bg" id="previewBg" />
            
            <!-- Overlay texts positioned on top of the template (positions set by JS) -->
            <div class="overlay-text overlay-name" id="overlay-name"></div>
            <div class="overlay-text" id="overlay-level"></div>
            <div class="overlay-text" id="overlay-class"></div>
            <div class="overlay-text" id="overlay-species"></div>
            
            <div class="overlay-text" id="overlay-init"></div>
            <div class="overlay-text" id="overlay-cd"></div>
            <div class="overlay-text" id="overlay-speed"></div>
            <div class="overlay-text" id="overlay-hp"></div>
            <div class="overlay-text" id="overlay-ac"></div>
            <!-- Defenses can be multiline, but we'll use a single div with white-space: pre-wrap -->
            <div class="overlay-text" id="overlay-defenses" style="text-align: left; white-space: pre-wrap;"></div>

            <!-- STR --> <div class="overlay-text stat-value" id="overlay-str-val"></div>
            <div class="overlay-text stat-mod" id="overlay-str-mod"></div>
            <div class="overlay-text stat-save" id="overlay-str-save"></div>
            <!-- DEX --> <div class="overlay-text stat-value" id="overlay-dex-val"></div>
            <div class="overlay-text stat-mod" id="overlay-dex-mod"></div>
            <div class="overlay-text stat-save" id="overlay-dex-save"></div>
            <!-- CON --> <div class="overlay-text stat-value" id="overlay-con-val"></div>
            <div class="overlay-text stat-mod" id="overlay-con-mod"></div>
            <div class="overlay-text stat-save" id="overlay-con-save"></div>
            <!-- INT --> <div class="overlay-text stat-value" id="overlay-int-val"></div>
            <div class="overlay-text stat-mod" id="overlay-int-mod"></div>
            <div class="overlay-text stat-save" id="overlay-int-save"></div>
            <!-- WIS --> <div class="overlay-text stat-value" id="overlay-wis-val"></div>
            <div class="overlay-text stat-mod" id="overlay-wis-mod"></div>
            <div class="overlay-text stat-save" id="overlay-wis-save"></div>
            <!-- CHA --> <div class="overlay-text stat-value" id="overlay-cha-val"></div>
            <div class="overlay-text stat-mod" id="overlay-cha-mod"></div>
            <div class="overlay-text stat-save" id="overlay-cha-save"></div>

            <!-- Weapons -->
            <!-- W1 --> <div class="overlay-text" id="overlay-w1-name" style="text-align: left;"></div>
            <div class="overlay-text" id="overlay-w1-atk"></div><div class="overlay-text" id="overlay-w1-dmg"></div>
            <div class="overlay-text" id="overlay-w1-type"></div><div class="overlay-text" id="overlay-w1-notes" style="text-align: left;"></div>
            <!-- W2 --> <div class="overlay-text" id="overlay-w2-name" style="text-align: left;"></div>
            <div class="overlay-text" id="overlay-w2-atk"></div><div class="overlay-text" id="overlay-w2-dmg"></div>
            <div class="overlay-text" id="overlay-w2-type"></div><div class="overlay-text" id="overlay-w2-notes" style="text-align: left;"></div>
            <!-- W3 --> <div class="overlay-text" id="overlay-w3-name" style="text-align: left;"></div>
            <div class="overlay-text" id="overlay-w3-atk"></div><div class="overlay-text" id="overlay-w3-dmg"></div>
            <div class="overlay-text" id="overlay-w3-type"></div><div class="overlay-text" id="overlay-w3-notes" style="text-align: left;"></div>
            <!-- W4 --> <div class="overlay-text" id="overlay-w4-name" style="text-align: left;"></div>
            <div class="overlay-text" id="overlay-w4-atk"></div><div class="overlay-text" id="overlay-w4-dmg"></div>
            <div class="overlay-text" id="overlay-w4-type"></div><div class="overlay-text" id="overlay-w4-notes" style="text-align: left;"></div>
            <!-- W5 --> <div class="overlay-text" id="overlay-w5-name" style="text-align: left;"></div>
            <div class="overlay-text" id="overlay-w5-atk"></div><div class="overlay-text" id="overlay-w5-dmg"></div>
            <div class="overlay-text" id="overlay-w5-type"></div><div class="overlay-text" id="overlay-w5-notes" style="text-align: left;"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
